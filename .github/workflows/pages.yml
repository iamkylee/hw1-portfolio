# 只把 site/ 目錄發佈到 GitHub Pages（RQ-1）。
# info/、SPEC.md、HISTORY.md、deliverables/ 等皆不會出現在網站上。
name: Deploy site/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard - info/ must never be published
        run: |
          if [ -n "$(git ls-files info)" ]; then
            echo "::error::info/ is tracked by git - run: git rm -r --cached info"; exit 1; fi
          if [ -e site/info ]; then echo "::error::site/info exists"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
