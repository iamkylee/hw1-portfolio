<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hierarchical multi-agent architecture</title>
  <desc id="d">Operator intent goes to a Chief Agent which delegates to three specialist agents; each acts on OSS systems and reports back.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif}
      .box{rx:10}
      .l{font-size:13px;font-weight:700}
      .s{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="520" height="400" fill="#f8fafc"/>
  <!-- intent -->
  <rect x="150" y="16" width="220" height="50" rx="25" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="260" y="38" text-anchor="middle" class="l" fill="#92400e">Operator intent</text>
  <text x="260" y="55" text-anchor="middle" class="s">“Move customer X to new port”</text>
  <line x1="260" y1="66" x2="260" y2="104" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <!-- chief -->
  <rect x="140" y="106" width="240" height="62" rx="12" fill="#0f766e"/>
  <text x="260" y="132" text-anchor="middle" class="l" fill="#fff" font-size="15">Chief Agent (LLM)</text>
  <text x="260" y="151" text-anchor="middle" font-size="11" fill="#ccfbf1">plan · delegate · verify</text>
  <!-- edges to specialists -->
  <g stroke="#64748b" stroke-width="2" marker-end="url(#a)">
    <line x1="200" y1="168" x2="95" y2="222"/><line x1="260" y1="168" x2="260" y2="222"/><line x1="320" y1="168" x2="425" y2="222"/>
  </g>
  <text x="96" y="186" class="s">Command</text><text x="372" y="186" class="s">Primary Key</text>
  <!-- specialists -->
  <g>
    <rect x="20" y="224" width="150" height="56" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="95" y="248" text-anchor="middle" class="l" fill="#134e4a">Inventory Agent</text>
    <text x="95" y="266" text-anchor="middle" class="s">resource lookup</text>
    <rect x="185" y="224" width="150" height="56" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="260" y="248" text-anchor="middle" class="l" fill="#134e4a">Provisioning Agent</text>
    <text x="260" y="266" text-anchor="middle" class="s">reconfigure service</text>
    <rect x="350" y="224" width="150" height="56" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="425" y="248" text-anchor="middle" class="l" fill="#134e4a">Verification Agent</text>
    <text x="425" y="266" text-anchor="middle" class="s">check &amp; rollback</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4">
    <line x1="95" y1="280" x2="95" y2="318"/><line x1="260" y1="280" x2="260" y2="318"/><line x1="425" y1="280" x2="425" y2="318"/>
  </g>
  <!-- OSS layer -->
  <rect x="20" y="320" width="480" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="260" y="346" text-anchor="middle" class="l" fill="#334155">Legacy OSS / BSS systems</text>
  <text x="260" y="364" text-anchor="middle" class="s">inventory DB · provisioning · network elements</text>
</svg>
